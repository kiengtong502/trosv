[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "S", "PT", "RUF", "PERF",
    "PIE", "RET", "ARG", "T20", "TID", "ASYNC", "LOG", "ISC", "ICN", "PGH", "PL", "TRY",
]
ignore = [
    "ISC001",   # conflicts with the formatter
    "TRY003",   # long messages in exception constructors are fine
    "PLR0913",  # request handlers legitimately take several parameters
    "PLR2004",  # small thresholds in heuristics read better inline
    "PLC0415",  # routers import lazily on purpose
    "TRY300",
    "TRY400",
    "E501",     # the formatter wraps what it can; long Vietnamese strings stay
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore:Using .httpx. with .starlette.testclient.:starlette.exceptions.StarletteDeprecationWarning",
]
testpaths = ["tests"]
