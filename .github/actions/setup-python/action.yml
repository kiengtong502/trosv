name: Set up Python and install the AI service
description: Python 3.12 with the pip cache, then runtime and dev requirements.
inputs:
  working-directory:
    description: Directory holding requirements*.txt
    default: apps/ai-service
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ${{ inputs.working-directory }}/requirements.txt
          ${{ inputs.working-directory }}/requirements-dev.txt

    - name: pip install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pip install --no-input -r requirements.txt -r requirements-dev.txt
