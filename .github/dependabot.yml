# Tu dong PR cap nhat dependencies (CVE + phien ban moi). Merge PR do nguoi
# quyet - khong tu dong merge. Cac package-ecosystem tuong ung CI:
# composer (backend job), npm (frontend job), docker (images trong compose
# + Dockerfiles), github-actions (actions da pin SHA trong .github/workflows).

version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /apps/ai-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/ai-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
