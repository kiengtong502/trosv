name: CI

on:
  push:
    branches: [unstable, stable]
  pull_request:
    branches: [unstable, stable]
  merge_group:
  workflow_dispatch:

# Least privilege: jobs only read the repo. Anything that needs more says so itself.
permissions:
  contents: read

# A newer push to the same branch/PR replaces the running CI. `stable` is never
# cancelled: the Deploy workflow keys off its CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' }}

env:
  CI: "true"
  COMPOSER_NO_INTERACTION: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-trixie
        env:
          POSTGRES_DB: rental_test
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Supply chain (audit run 3): actions pinned to commit SHAs - a mutable tag
      # can be repointed, a commit SHA cannot. Comment keeps the version readable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json and lock file
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (style)
        run: ./vendor/bin/pint --test

      # Larastan at the strictest level (max). The baseline only freezes the
      # debt that existed when it was introduced: any NEW finding fails the job.
      - name: PHPStan / Larastan (level max)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Copy env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # phpunit.xml fails the run on warnings, notices, deprecations, risky and
      # output-printing tests, so "green" really means zero warnings.
      - name: Tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rental_test
          DB_USERNAME: rental
          DB_PASSWORD: rental

      - name: Composer audit
        run: composer audit --locked --no-interaction

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint (strictTypeChecked, --max-warnings 0) covers src and e2e.
      - name: Lint
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Zero-warning build: any Vite/Rollup warning (oversized chunk, bad import...)
      # fails the job, not just errors.
      - name: Build (warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -Eiq '\(!\)|warning' build.log; then
            echo "::error::the production build printed warnings"
            exit 1
          fi

      # Blocking. Production dependencies must be clean at every severity; dev
      # tooling may not carry a high/critical advisory.
      - name: npm audit (production, any severity)
        run: npm audit --omit=dev --audit-level=low

      - name: npm audit (all, high and above)
        run: npm audit --audit-level=high

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/ai-service/requirements.txt
            apps/ai-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy app

      # pyproject.toml turns every warning into an error.
      - name: Contract tests
        run: pytest
        env:
          FAKE_MODE: "true"

      - name: pip-audit
        run: pip-audit -r requirements.txt

  # E2E: real browser against a real seeded API + the production bundle.
  # Runs after the cheap gates; also gates the Deploy workflow (it fires on
  # CI success on stable), so a red e2e blocks the deploy - intended.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, ai-service]
    services:
      postgres:
        image: postgres:16-trixie
        env:
          POSTGRES_DB: rental_e2e
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rental_e2e
      DB_USERNAME: rental
      DB_PASSWORD: rental
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # ---- API: deps, schema, seed data, then serve on :8000 ----
      - name: Backend dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist

      - name: Backend env + key
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # public/storage la symlink gitignored - khong co no thi /storage/*
          # rot vao index.php cua Laravel (403/404) thay vi tra anh that.
          php artisan storage:link

      - name: Migrate + seed demo data
        working-directory: apps/api
        run: php artisan migrate:fresh --seed --force

      - name: Serve API on :8000
        working-directory: apps/api
        run: |
          # CORS must accept the preview origin the browser will use.
          PHP_CLI_SERVER_WORKERS=4 FRONTEND_URL=http://localhost:4173 nohup php artisan serve \
            --host=127.0.0.1 --port=8000 --no-reload > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/cities > /dev/null && break
            [ "$i" = 30 ] && { cat /tmp/api.log; exit 1; }
            sleep 1
          done
          echo "API ready"

      # ---- Web: production build (incl. check:css + tsc) on :4173 ----
      - name: Frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production bundle
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Serve bundle on :4173
        working-directory: apps/web
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            [ "$i" = 30 ] && { cat /tmp/web.log; exit 1; }
            sleep 1
          done
          echo "web ready"

      # The bundle bakes VITE_API_URL (defaults to http://localhost:8000/api)
      # at build time; FRONTEND_URL=4173 on the serve step allows that origin.
      - name: Playwright tests
        working-directory: apps/web
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:4173

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== /tmp/api.log ==="
          cat /tmp/api.log || true
          echo "=== /tmp/web.log ==="
          cat /tmp/web.log || true
          echo "=== apps/api/storage/logs/laravel.log ==="
          cat apps/api/storage/logs/laravel.log || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # full history so gitleaks scans past commits too

      # Blocking since triage confirmed zero findings across all 157 commits
      # (baseline run). --redact hides matched secret values from the log. If
      # a future scan ever fails on a known-acceptable finding, add an inline
      # allowlist with a justification comment in .gitleaksignore.
      # Supply chain (audit run 3): image pinned to an immutable digest, and
      # the repo is mounted read-only - the scanner needs no write access.
      - name: gitleaks (blocking)
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            zricethezav/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source /repo --redact -v

  # Lints the pipeline itself and the infra files: a broken workflow, Dockerfile
  # or shell script should fail here, not on the production deploy.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: actionlint (workflows)
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # DL3008 (pin apt versions) is ignored on purpose: the base images are
      # Debian point releases, and pinned apt versions disappear from the mirrors.
      - name: hadolint (Dockerfiles)
        run: |
          for f in apps/api/Dockerfile apps/web/Dockerfile apps/ai-service/Dockerfile; do
            docker run --rm -i \
              hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
              hadolint --failure-threshold warning --ignore DL3008 - < "$f"
          done

      - name: shellcheck (scripts)
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            koalaman/shellcheck-alpine@sha256:7366322e994f1b364289c7f7d4b792846fbc9337ae29c89a489fb57ba8f4a8dc \
            shellcheck --severity=warning scripts/*.sh infra/backup/backup.sh infra/deploy/deploy.sh

      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile tls --profile test config --quiet

  # Every image must still build; this catches Dockerfile and lockfile drift
  # before the deploy does.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build backend image
        run: docker build --pull apps/api
      - name: Build web image
        run: docker build --pull apps/web
      - name: Build ai-service image
        run: docker build --pull apps/ai-service

  # One required check for branch protection: green only if every job above is
  # green. A skipped or cancelled needed job counts as a failure.
  ci-ok:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, frontend, ai-service, e2e, secrets, infra, docker-build]
    steps:
      - name: All jobs must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required job finished as '$r'"; exit 1; }
          done
