name: PR Guard

# Auto-reject PRs that break the house PR rules (see .github/PULL_REQUEST_TEMPLATE.md):
# diff size limit, one app per PR, mandatory screenshot for apps/web changes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Kiem tra quy tac PR
        run: .github/scripts/pr-guard.sh "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
